    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#rx-semantic-atlas .atlas-stage{position:relative;width:100%;height:690px;overflow:auto;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);touch-action:pan-x pan-y}
#rx-semantic-atlas .atlas-stage.dragging{cursor:grabbing}
#rx-semantic-atlas .atlas-stage svg{display:block;max-width:none;font-family:&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,sans-serif}
#atlas-sheet{transform-origin:top left;position:absolute;top:0;left:0;width:5600px}
#atlas-extent{position:relative;overflow:hidden}
#rx-semantic-atlas .atlas-inspector{padding:16px 0 12px;border-bottom:1px solid var(--border)}
#rx-semantic-atlas .atlas-inspector-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#rx-semantic-atlas .atlas-inspector h3{margin:0}
#rx-semantic-atlas .atlas-inspector p{margin:10px 0;line-height:1.7}
#rx-semantic-atlas .atlas-source,#rx-semantic-atlas .atlas-foot,#atlas-detail-call{color:var(--muted);overflow-wrap:anywhere}
#rx-semantic-atlas .atlas-foot{margin-top:10px}
#atlas-svg text{fill:var(--ink)}
#atlas-svg .canvas-title{font-size:44px;font-weight:700}
#atlas-svg .canvas-note{font-size:23px;fill:var(--muted)}
#atlas-svg .layer-bg{fill:var(--layer);stroke:var(--border);stroke-width:1.5}
#atlas-svg .family-bg{fill:var(--family);fill-opacity:.45;stroke:var(--border);stroke-width:1}
#atlas-svg .layer-title{font-size:28px;font-weight:700}
#atlas-svg .layer-note{font-size:19px;fill:var(--muted)}
#atlas-svg .family-title{font-size:26px;font-weight:700}
#atlas-svg .node-box{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
#atlas-svg .node-accent{fill:none;stroke:var(--cat);stroke-width:4}
#atlas-svg .node-title{font-size:24px;font-weight:600}
#atlas-svg .node-note{font-size:19px;fill:var(--muted)}
#atlas-svg .node-meta{font-size:17px;fill:var(--muted)}
#atlas-svg .edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#atlas-arrow)}
#atlas-svg .edge.reference{stroke:var(--ref);stroke-dasharray:6 6;marker-end:url(#atlas-ref)}
#atlas-svg .edge.variant{stroke:var(--expr);stroke-dasharray:8 7}
#atlas-svg .edge-fn{font-size:17px;fill:var(--fn);font-family:Consolas,&#x27;Microsoft YaHei&#x27;,sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:6;stroke-linejoin:round}
#atlas-svg .edge-field{font-size:21px;fill:var(--muted);paint-order:stroke;stroke:var(--layer);stroke-width:9;stroke-linejoin:round}
#atlas-svg .node.is-dim{opacity:.28}
#atlas-svg .edge.is-dim,#atlas-svg .edge-label.is-dim{opacity:.11}
#atlas-svg .node.is-focus .node-box{stroke:var(--decl);stroke-width:4}
@media(prefers-color-scheme:dark){#rx-semantic-atlas{--bg:#101a2a;--surface:#17263b;--ink:#e5edf9;--muted:#b6c6dc;--border:#39516b;--line:#8ba2bd;--layer:#101a2a;--family:#17263b;--decl:#79a6ff;--stmt:#5bd6c8;--expr:#c0a1ff;--type:#ffb36b;--ref:#ffad5c;--fn:#a8c9ff}}
@media(max-width:600px){#rx-semantic-atlas .atlas-stage{height:520px}#rx-semantic-atlas .atlas-locate span{width:100%}}

&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;rx-semantic-atlas&#x27;);
  const svg=root.querySelector(&#x27;#atlas-svg&#x27;),stage=root.querySelector(&#x27;#atlas-stage&#x27;),select=root.querySelector(&#x27;#atlas-select&#x27;);
  const groups=[{&quot;id&quot;:&quot;input&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;入口｜语法已经正确，含义还需要检查&quot;,&quot;edge&quot;:&quot;analyze → Analyzer::run&quot;,&quot;lines&quot;:[&quot;输入：只读 AST + 诊断收集器&quot;,&quot;目标：名字有定义、类型可兼容、访问有权限&quot;],&quot;explain&quot;:&quot;语法阶段只说明程序能按文法组成 AST。analyze 新建 Analyzer，run 组织分析。分析器读取原 AST，不重新解析文本，也不执行程序。两大阶段不是恰好两次完整遍历：准备阶段内部有多轮处理与依赖递归。&quot;,&quot;source&quot;:&quot;semantic.cpp:169,1719&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;purpose-a&quot;,&quot;title&quot;:&quot;Ⅰ 先知道“有哪些东西”&quot;,&quot;edge&quot;:&quot;run：前五个步骤&quot;,&quot;lines&quot;:[&quot;遍历：顶层声明 + 受限常量表达式&quot;,&quot;建立：名字、签名、字段、常量值&quot;,&quot;目的：正文引用声明时有据可查&quot;],&quot;explain&quot;:&quot;即使被调用函数写在后面，正文检查时也能先查到其签名。此阶段尚未深入检查普通函数体，但数组长度等依赖会提前触发常量类型解析和求值。&quot;,&quot;source&quot;:&quot;semantic.cpp:170–174&quot;},{&quot;id&quot;:&quot;purpose-b&quot;,&quot;title&quot;:&quot;Ⅱ 再判断“使用得对不对”&quot;,&quot;edge&quot;:&quot;run → check_functions&quot;,&quot;lines&quot;:[&quot;遍历：函数 → block → stmt / expr&quot;,&quot;读取：阶段Ⅰ准备好的声明信息&quot;,&quot;补充：局部绑定、表达式类型与调整&quot;],&quot;explain&quot;:&quot;每个函数都有新的局部作用域上下文。递归检查表达式时，期望类型从父节点向下流动，实际类型与访问属性从子节点向上返回。&quot;,&quot;source&quot;:&quot;semantic.cpp:175,685–720&quot;}]},{&quot;id&quot;:&quot;collect&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Ⅰ · 01 登记全局名字&quot;,&quot;edge&quot;:&quot;run → collect_items&quot;,&quot;lines&quot;:[&quot;先保存声明身份和 AST 指针，不检查函数体&quot;,&quot;输出：结构体表、函数表、常量表、待处理 impl&quot;],&quot;explain&quot;:&quot;按顶层 Item 分派：结构体进入类型命名空间，函数和常量进入值命名空间；检查重名和内建名称冲突。SymbolId 直接复用声明的 NodeId，不额外分配 TypeId 或 FunctionId。&quot;,&quot;source&quot;:&quot;semantic.cpp:211–262&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;items&quot;,&quot;title&quot;:&quot;struct · fn · const&quot;,&quot;edge&quot;:&quot;collect_items → visit&quot;,&quot;lines&quot;:[&quot;struct：登记类型名&quot;,&quot;fn / const：登记值名&quot;,&quot;impl：暂存；use：本层忽略&quot;],&quot;explain&quot;:&quot;这里的 visit 是 std::visit 的分派 lambda。Use 不建立导入解析系统；impl 的关联成员等到声明解析阶段集中登记。&quot;,&quot;source&quot;:&quot;semantic.cpp:211–247&quot;},{&quot;id&quot;:&quot;symbols&quot;,&quot;title&quot;:&quot;符号身份&quot;,&quot;edge&quot;:&quot;collect_items → record_symbol&quot;,&quot;lines&quot;:[&quot;声明 NodeId 就是 SymbolId&quot;,&quot;保存种类、名字、所属 owner&quot;,&quot;按 ID 去重；使用点引用此身份&quot;],&quot;explain&quot;:&quot;参数、字段、局部变量也会在各自处理阶段调用 record_symbol。相同拼写不意味着相同符号：两次 let x 拥有不同声明 NodeId。&quot;,&quot;source&quot;:&quot;semantic.cpp:205–209；semantic.hpp:14&quot;},{&quot;id&quot;:&quot;names&quot;,&quot;title&quot;:&quot;内建名字保护&quot;,&quot;edge&quot;:&quot;builtin_type / protected_builtin_value&quot;,&quot;lines&quot;:[&quot;类型名：整数、bool、Box、Vec 等&quot;,&quot;保留能力名：Copy / Clone / Eq 等&quot;,&quot;受保护 I/O 名不允许覆盖&quot;],&quot;explain&quot;:&quot;这些查询用于拒绝与内建实体冲突的声明。完整识别集合与普通函数路径识别集合不同，不能把所有内建别名都理解为受保护名称。&quot;,&quot;source&quot;:&quot;semantic.cpp:249–261&quot;}]},{&quot;id&quot;:&quot;declarations&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Ⅰ · 02 把声明变成可查询的类型规则&quot;,&quot;edge&quot;:&quot;run → resolve_declarations&quot;,&quot;lines&quot;:[&quot;先登记全部关联成员，再解析常量、字段和签名&quot;,&quot;ast::Type 是语法；TyPtr 是检查时使用的语义类型&quot;],&quot;explain&quot;:&quot;实际内部顺序：注册所有 impl 关联项 → 全局与关联常量类型 → 关联函数签名 → struct 字段与 derive 标签 → 普通函数签名。签名解析与函数体检查分离，是支持正文前向引用的关键。&quot;,&quot;source&quot;:&quot;semantic.cpp:410–497&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;impl&quot;,&quot;title&quot;:&quot;impl · 关联成员&quot;,&quot;edge&quot;:&quot;resolve_declarations → resolve_type&quot;,&quot;lines&quot;:[&quot;目标必须是已知 struct&quot;,&quot;登记 Owner::fn / Owner::const&quot;,&quot;跨 impl 检查关联名字冲突&quot;],&quot;explain&quot;:&quot;impl 提供 Self 的所属结构体语境。所有关联成员先登记，随后才解析成员声明的类型；这些表不是通用 Trait 实现系统。&quot;,&quot;source&quot;:&quot;semantic.cpp:411–450&quot;},{&quot;id&quot;:&quot;signature&quot;,&quot;title&quot;:&quot;fn · 函数签名&quot;,&quot;edge&quot;:&quot;resolve_declarations → resolve_function&quot;,&quot;lines&quot;:[&quot;逐个解析参数类型和返回类型&quot;,&quot;检查参数重名，保存 owner&quot;,&quot;此时不建立活动的参数作用域&quot;],&quot;explain&quot;:&quot;FunctionInfo 保存参数 TyPtr 列表、返回 TyPtr、owner 和 AST 指针。check_function 之后才根据这些签名把参数绑定到当前作用域。&quot;,&quot;source&quot;:&quot;semantic.cpp:485–496&quot;},{&quot;id&quot;:&quot;fields&quot;,&quot;title&quot;:&quot;struct · 字段与派生标签&quot;,&quot;edge&quot;:&quot;resolve_declarations → resolve_type&quot;,&quot;lines&quot;:[&quot;字段名 → 类型 + 字段符号&quot;,&quot;拒绝重名字段、重复 derive&quot;,&quot;Copy 要显式 Clone；Eq 要 PartialEq&quot;],&quot;explain&quot;:&quot;这里先登记显式能力标签并检查配套标签；每个字段是否真正具备该能力，要在 validate_layouts_and_derives 中递归验证。不会自动补上缺失的 Clone 或 PartialEq。&quot;,&quot;source&quot;:&quot;semantic.cpp:459–481&quot;},{&quot;id&quot;:&quot;type&quot;,&quot;title&quot;:&quot;type · 递归类型树&quot;,&quot;edge&quot;:&quot;resolve_type → resolve_type_impl&quot;,&quot;lines&quot;:[&quot;i32 / u32 / isize / usize / bool / ()&quot;,&quot;Self、struct、&amp;T、&amp;mut T、[T; N]&quot;,&quot;Box\u003cT&gt; / Vec\u003cT&gt;；按类型 NodeId 记结果&quot;],&quot;explain&quot;:&quot;引用、数组、Box 和 Vec 递归解析 element。Self 需要 owner。容器需要一个具体类型实参；普通结构体不接受泛型类型实参。解析失败报告错误并返回 Error。局部注解和 as 的目标类型也复用此入口。&quot;,&quot;source&quot;:&quot;semantic.cpp:263–331&quot;},{&quot;id&quot;:&quot;length&quot;,&quot;title&quot;:&quot;array · 编译期长度&quot;,&quot;edge&quot;:&quot;resolve_type_impl → evaluate_length&quot;,&quot;lines&quot;:[&quot;长度来自 usize 常量或整数字面量&quot;,&quot;处理括号和 Self::N&quot;,&quot;数组类型保存数值长度，不保存 N 文本&quot;],&quot;explain&quot;:&quot;查到常量时调用 resolve_constant_type 和 evaluate_constant；要求已成功求值、类型 usize 且非负。否则尝试带可选 usize 后缀的字面量。不是任意常量算式解释器。&quot;,&quot;source&quot;:&quot;semantic.cpp:333–373&quot;},{&quot;id&quot;:&quot;ctype&quot;,&quot;title&quot;:&quot;const · 类型依赖&quot;,&quot;edge&quot;:&quot;resolve_constant_type → resolve_type&quot;,&quot;lines&quot;:[&quot;Fresh → Resolving → Done / Failed&quot;,&quot;再次遇到 Resolving：类型依赖成环&quot;,&quot;与“常量值求值”的状态分开&quot;],&quot;explain&quot;:&quot;例如常量声明的数组类型又通过数组长度依赖常量，可能形成类型解析环。此状态机与求初始化值的 Evaluating 状态机独立，不能合并。&quot;,&quot;source&quot;:&quot;semantic.cpp:375–391&quot;}]},{&quot;id&quot;:&quot;constants&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Ⅰ · 03 计算并验证全部常量&quot;,&quot;edge&quot;:&quot;run → validate_constants&quot;,&quot;lines&quot;:[&quot;既检查全局 const，也检查关联 const&quot;,&quot;提前被长度依赖触发过的求值，会复用已有状态&quot;],&quot;explain&quot;:&quot;validate_constants 遍历两张常量表，保证未被引用的非法常量也不被漏检。evaluate_constant 先确保声明类型，再递归求值并比较结果类型。此阶段已经会为受限常量表达式记录语义事实。&quot;,&quot;source&quot;:&quot;semantic.cpp:498–588&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;eval&quot;,&quot;title&quot;:&quot;依赖 DFS · 常量值&quot;,&quot;edge&quot;:&quot;validate_constants → evaluate_constant&quot;,&quot;lines&quot;:[&quot;Fresh → Evaluating → Done / Failed&quot;,&quot;回到 Evaluating：常量值依赖环&quot;,&quot;成功缓存类型与整数值&quot;],&quot;explain&quot;:&quot;求值时通过常量路径递归访问依赖。Done 直接返回；遇到正在求值的节点则诊断环。失败保留状态以避免无穷递归和重复计算。&quot;,&quot;source&quot;:&quot;semantic.cpp:505–528&quot;},{&quot;id&quot;:&quot;const-expr&quot;,&quot;title&quot;:&quot;受限 const 表达式&quot;,&quot;edge&quot;:&quot;evaluate_constant → constant_value&quot;,&quot;lines&quot;:[&quot;允许：整数、bool、取负、常量路径&quot;,&quot;路径递归 → evaluate_constant&quot;,&quot;记录表达式事实；拒绝其他表达式&quot;],&quot;explain&quot;:&quot;这不是第二阶段的 check_expr。constant_value 自己处理允许的少数节点，递归调用自身和 evaluate_constant；类型不符或非法表达式均进入诊断。&quot;,&quot;source&quot;:&quot;semantic.cpp:530–588&quot;},{&quot;id&quot;:&quot;number&quot;,&quot;title&quot;:&quot;整数值与范围&quot;,&quot;edge&quot;:&quot;literal_type → parse_unsigned&quot;,&quot;lines&quot;:[&quot;去掉分隔符，识别十 / 二 / 八 / 十六进制&quot;,&quot;后缀优先；再看期望整数；否则 i32&quot;,&quot;字面量原始数值检查 32 位范围&quot;],&quot;explain&quot;:&quot;parse_unsigned 要求整个数字串都被解析，而不是接受有效前缀。literal_type 也用于正文中的整数表达式；signed_integer 用于检查负号是否适用于有符号整数。&quot;,&quot;source&quot;:&quot;semantic.cpp:393–408,774–798&quot;}]},{&quot;id&quot;:&quot;validation&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Ⅰ · 04 验证布局有限、派生能力成立&quot;,&quot;edge&quot;:&quot;run → validate_layouts_and_derives&quot;,&quot;lines&quot;:[&quot;检查的是类型依赖图，不是执行对象分配&quot;,&quot;布局检查完成后，再逐字段核验显式 derive&quot;],&quot;explain&quot;:&quot;先对所有结构体运行有限布局 DFS，再检查每个显式派生能力。这里只证明按值展开不会无限递归，并不在此计算字节数、对齐或成员偏移。&quot;,&quot;source&quot;:&quot;semantic.cpp:590–668&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;layout&quot;,&quot;title&quot;:&quot;struct / array · 按值展开&quot;,&quot;edge&quot;:&quot;validate_layouts_and_derives → validate_layout&quot;,&quot;lines&quot;:[&quot;struct 字段、array 元素继续 DFS&quot;,&quot;Ref / Box / Vec 为间接边，不展开&quot;,&quot;Visiting 回边 → 无限大小布局错误&quot;],&quot;explain&quot;:&quot;状态从 Fresh 到 Visiting，最后成为 Valid 或 Invalid。struct A { a: A } 不能有有限大小，而经引用或所有者容器间接连接的递归不会被当作按值布局环。&quot;,&quot;source&quot;:&quot;semantic.cpp:607–632&quot;},{&quot;id&quot;:&quot;traits&quot;,&quot;title&quot;:&quot;Copy · Clone · PartialEq · Eq&quot;,&quot;edge&quot;:&quot;validate_layouts_and_derives → supports&quot;,&quot;lines&quot;:[&quot;基本类型、引用、容器有内建规则&quot;,&quot;array 递归检查元素能力&quot;,&quot;struct 要有显式标签且字段满足规则&quot;],&quot;explain&quot;:&quot;这是一套受限的内建能力判定，不是开放式 Trait 求解器。Box/Vec 不能 Copy；共享引用可 Copy/Clone，可变引用不可；结构体递归检查用 visited 集合终止环。相等运算、clone 与重复数组也复用 supports。&quot;,&quot;source&quot;:&quot;semantic.cpp:634–668&quot;}]},{&quot;id&quot;:&quot;entry&quot;,&quot;stage&quot;:&quot;a&quot;,&quot;title&quot;:&quot;Ⅰ · 05 核验 main；全局规则准备完成&quot;,&quot;edge&quot;:&quot;run → validate_entry&quot;,&quot;lines&quot;:[&quot;main 必须存在，无值参数、无生命周期参数，返回 ()&quot;,&quot;交给第二阶段：声明表 + 签名 + 字段类型 + 常量值&quot;],&quot;explain&quot;:&quot;这是 run 调用 check_functions 之前的最后一个全局检查。即使已报告错误，分析器仍可继续收集诊断；真正阻止 lowering 的错误闸门在 main.cpp。&quot;,&quot;source&quot;:&quot;semantic.cpp:670–683&quot;,&quot;children&quot;:[]},{&quot;id&quot;:&quot;function&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;title&quot;:&quot;Ⅱ · 01 为每个函数建立检查语境&quot;,&quot;edge&quot;:&quot;run → check_functions → check_function&quot;,&quot;lines&quot;:[&quot;遍历普通函数和关联函数，按已解析签名检查正文&quot;,&quot;向函数体传入返回类型；结束后再确认正文结果兼容&quot;],&quot;explain&quot;:&quot;这里开始深入函数体。check_function 清空并新建作用域，设置 current_function，绑定 self 和参数，然后调用 check_expr(body, resultType)。正文完成后检查结果可转换到函数返回类型，并清除当前函数指针。&quot;,&quot;source&quot;:&quot;semantic.cpp:685–720&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;scope&quot;,&quot;title&quot;:&quot;scope · 词法作用域栈&quot;,&quot;edge&quot;:&quot;check_function / check_block → scopes_&quot;,&quot;lines&quot;:[&quot;局部名 → 类型、mut、声明 ID&quot;,&quot;进入 block 压栈，退出时弹栈&quot;,&quot;lookup 从内向外找，支持同名遮蔽&quot;],&quot;explain&quot;:&quot;这是活动的栈，不是 collect_items 生成的持久作用域树。参数在函数入口加入，局部 let 在其初始化器检查之后加入；使用点记录所查到声明的 SymbolId。&quot;,&quot;source&quot;:&quot;semantic.cpp:692–727,1090–1139&quot;},{&quot;id&quot;:&quot;self&quot;,&quot;title&quot;:&quot;self · 参数与返回语境&quot;,&quot;edge&quot;:&quot;check_function → record_symbol&quot;,&quot;lines&quot;:[&quot;按签名绑定普通参数&quot;,&quot;按 &amp;self / &amp;mut self 等形状绑定 self&quot;,&quot;current_function 提供 owner 与返回类型&quot;],&quot;explain&quot;:&quot;普通参数有自己的声明 ID；self 的绑定使用当前方法的声明 ID。current_function 的 owner 供 Self 路径解释使用，result 供 return 检查使用。&quot;,&quot;source&quot;:&quot;semantic.cpp:692–720&quot;},{&quot;id&quot;:&quot;loop-stack&quot;,&quot;title&quot;:&quot;loop · 循环语境栈&quot;,&quot;edge&quot;:&quot;check_loop / check_while → loops_&quot;,&quot;lines&quot;:[&quot;每层保存期望结果和 break 类型&quot;,&quot;break / continue 只作用于最近循环&quot;,&quot;退出该循环时弹栈并核对结果&quot;],&quot;explain&quot;:&quot;loop 可接收 break value；while 对应 Unit 目标。检查 while 条件时会暂时隔离外围循环上下文，避免条件中的跳转错误地绑定外围循环。&quot;,&quot;source&quot;:&quot;semantic.cpp:1174–1209,1655–1672&quot;}]},{&quot;id&quot;:&quot;dispatch&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;parent&quot;:&quot;function&quot;,&quot;title&quot;:&quot;Ⅱ · 递归入口：一棵表达式树，双向信息流&quot;,&quot;edge&quot;:&quot;check_function → check_expr(body, 返回类型)&quot;,&quot;lines&quot;:[&quot;向下：父节点给子节点期望类型 expected（可为空）&quot;,&quot;向上：子节点返回 ExprInfo＝实际类型 + 访问属性&quot;],&quot;explain&quot;:&quot;以下所有种类都是 check_expr 的分派分支，不是依次执行的步骤。遇到子表达式时，专门检查函数再次调用 check_expr；递归终止于字面量、路径等叶子。期望类型只在实现允许的位置传播，不是通用全局约束求解。&quot;,&quot;source&quot;:&quot;semantic.cpp:850–908&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;integer&quot;,&quot;title&quot;:&quot;integer · 整数字面量&quot;,&quot;edge&quot;:&quot;check_expr → literal_type&quot;,&quot;lines&quot;:[&quot;无后缀：参考 expected 整数类型&quot;,&quot;有后缀：按后缀决定类型&quot;,&quot;无上下文：默认 i32；检查范围&quot;],&quot;explain&quot;:&quot;例如 let n: usize = 3 会把 usize 传给整数 3。函数参数、字段、数组元素和返回值也能提供这种局部语境。不会根据更晚的语句反向推断已经建立的局部绑定。&quot;,&quot;source&quot;:&quot;semantic.cpp:774–798,856–857&quot;},{&quot;id&quot;:&quot;literal&quot;,&quot;title&quot;:&quot;bool · unit&quot;,&quot;edge&quot;:&quot;check_expr → ty&quot;,&quot;lines&quot;:[&quot;true / false → Bool&quot;,&quot;() → Unit&quot;,&quot;没有子表达式，无须查作用域&quot;],&quot;explain&quot;:&quot;Boolean 与 Unit 在 check_expr 中直接创建语义类型。它们不是整数推断的分支，也不通过期望类型随意变成其他类型。&quot;,&quot;source&quot;:&quot;semantic.cpp:858–861&quot;},{&quot;id&quot;:&quot;path&quot;,&quot;title&quot;:&quot;path · 名字指向谁&quot;,&quot;edge&quot;:&quot;check_expr → check_path&quot;,&quot;lines&quot;:[&quot;单名优先查局部，再查全局实体&quot;,&quot;限定路径查关联项；Self 替换 owner&quot;,&quot;返回类型 + 符号；函数另带 target&quot;],&quot;explain&quot;:&quot;join_path 组合路径；lookup 查局部。builtin_function 与 constructor_path 识别内建候选。普通局部绑定是 place；函数路径返回 Function 类型标记和确定名字。候选路径识别不等于调用参数已经合法。&quot;,&quot;source&quot;:&quot;semantic.cpp:910–980,1686–1694&quot;},{&quot;id&quot;:&quot;array&quot;,&quot;title&quot;:&quot;array · 元素 + 长度&quot;,&quot;edge&quot;:&quot;check_expr → check_array&quot;,&quot;lines&quot;:[&quot;[a,b]：逐元素检查并求公共类型&quot;,&quot;[x;N]：N 为编译期长度；多份需 Copy&quot;,&quot;空数组需上下文，核对类型和长度&quot;],&quot;explain&quot;:&quot;从 expected Array 取得元素类型和长度。列表元素通过 common_type 做有方向的有限适配，必要时记录调整；重复式通过 supports 检查 Copy。次数不接受任意局部变量。&quot;,&quot;source&quot;:&quot;semantic.cpp:982–1055&quot;},{&quot;id&quot;:&quot;struct-expr&quot;,&quot;title&quot;:&quot;struct · 命名字段初始化&quot;,&quot;edge&quot;:&quot;check_expr → check_struct&quot;,&quot;lines&quot;:[&quot;查结构体声明，处理 Self&quot;,&quot;字段声明类型向下约束初始化值&quot;,&quot;拒绝未知、重复和遗漏字段&quot;],&quot;explain&quot;:&quot;结构体字面量的每个字段表达式都递归 check_expr，并与声明中的字段类型核对。最终返回命名 Struct 类型并带结构体符号身份。&quot;,&quot;source&quot;:&quot;semantic.cpp:1057–1088&quot;},{&quot;id&quot;:&quot;block&quot;,&quot;title&quot;:&quot;block · 语句与尾值&quot;,&quot;edge&quot;:&quot;check_expr → check_block&quot;,&quot;lines&quot;:[&quot;压入作用域，按 stmt 顺序处理&quot;,&quot;let 先检查初值，再登记新名字&quot;,&quot;最后无分号表达式接收 expected&quot;],&quot;explain&quot;:&quot;Empty 直接跳过。let 有注解则 resolve_type 后约束初值，没有注解则使用初值类型。非尾部无分号表达式必须是 Unit/Never；尾表达式决定块结果，最后的 Never 也可成为块结果；退出时弹出作用域。&quot;,&quot;source&quot;:&quot;semantic.cpp:1090–1139&quot;},{&quot;id&quot;:&quot;if&quot;,&quot;title&quot;:&quot;if · 条件与分支汇合&quot;,&quot;edge&quot;:&quot;check_expr → check_if&quot;,&quot;lines&quot;:[&quot;condition → Bool；两分支继承 expected&quot;,&quot;有 else：按可转换方向选择公共类型&quot;,&quot;无 else：then 只能 () / !；整体为 ()&quot;],&quot;explain&quot;:&quot;先处理 Never 分支，让另一分支决定正常结果。其余先试 else→then，再试 then→else；可兼容时用 append_adjustments 回填需要转换的分支。两向均失败才报类型冲突，并非完整的泛型 LUB 算法。&quot;,&quot;source&quot;:&quot;semantic.cpp:1141–1172&quot;},{&quot;id&quot;:&quot;loop&quot;,&quot;title&quot;:&quot;loop · 由 break 决定结果&quot;,&quot;edge&quot;:&quot;check_expr → check_loop&quot;,&quot;lines&quot;:[&quot;循环体要求 Unit / Never&quot;,&quot;结果取 expected，否则取首个 break 类型&quot;,&quot;检查其余 break；没有 break → Never&quot;],&quot;explain&quot;:&quot;检查体之前 push LoopInfo，体检查结束后 pop。所有 break value 都已在相应 check_break 中被检查。当前实现不对 break 集合运行一般的不动点求解。&quot;,&quot;source&quot;:&quot;semantic.cpp:1174–1189&quot;},{&quot;id&quot;:&quot;while&quot;,&quot;title&quot;:&quot;while · 条件与循环体&quot;,&quot;edge&quot;:&quot;check_expr → check_while&quot;,&quot;lines&quot;:[&quot;条件必须 Bool；体须 Unit / Never&quot;,&quot;条件检查时暂时隔离外围 loops&quot;,&quot;禁止带值 break；整个 while 为 ()&quot;],&quot;explain&quot;:&quot;while 条件仍能包含自身内部新建循环的合法跳转，但不能借用条件外面的循环上下文。正文在期望 Unit 的循环语境中检查。&quot;,&quot;source&quot;:&quot;semantic.cpp:1191–1209&quot;},{&quot;id&quot;:&quot;unary&quot;,&quot;title&quot;:&quot;unary · 借用与一元运算&quot;,&quot;edge&quot;:&quot;check_expr → check_unary&quot;,&quot;lines&quot;:[&quot;&amp; / &amp;mut：构造引用，检查写权限&quot;,&quot;*：Ref / Box → 元素 place&quot;,&quot;!：bool / 整数；-：有符号整数&quot;],&quot;explain&quot;:&quot;借用子表达式不接受外部 expected；当前实现允许借用临时值。&amp;mut 拒绝不可变 place 或 access_locked。显式解引用计算 place、可写性并传播共享访问锁；&amp;&amp; 表示两层借用。&quot;,&quot;source&quot;:&quot;semantic.cpp:1211–1252&quot;},{&quot;id&quot;:&quot;binary&quot;,&quot;title&quot;:&quot;binary · 两个操作数&quot;,&quot;edge&quot;:&quot;check_expr → check_binary&quot;,&quot;lines&quot;:[&quot;先检查左；左类型作为右的有限语境&quot;,&quot;逻辑 / 比较 → Bool；算术等 → 数值类型&quot;,&quot;相等要求 PartialEq；移位检查整数&quot;],&quot;explain&quot;:&quot;scalar_operand 在部分规则中剥去一层共享引用。普通整数运算要求相同类型，移位允许两侧整数类型不同；逻辑运算要求原始两侧 Bool。语义访问先后不代表运行时求值顺序。&quot;,&quot;source&quot;:&quot;semantic.cpp:1254–1312&quot;},{&quot;id&quot;:&quot;assign&quot;,&quot;title&quot;:&quot;assign · 目标位置与右值&quot;,&quot;edge&quot;:&quot;check_expr → check_assignment&quot;,&quot;lines&quot;:[&quot;左侧必须 place 且可写&quot;,&quot;左类型向下约束右侧表达式&quot;,&quot;普通 / 复合赋值各自核对；结果 ()&quot;],&quot;explain&quot;:&quot;仅有类型兼容并不足以赋值，目标还必须有可修改的存储位置。复合赋值继续检查标量与运算符规则。lowering 对赋值的运行时顺序另有安排，不能从这里的访问顺序推导。&quot;,&quot;source&quot;:&quot;semantic.cpp:1314–1341&quot;},{&quot;id&quot;:&quot;cast&quot;,&quot;title&quot;:&quot;cast · 显式 as&quot;,&quot;edge&quot;:&quot;check_expr → check_cast&quot;,&quot;lines&quot;:[&quot;检查源表达式；resolve_type 解析目标&quot;,&quot;仅允许 整数→整数、bool→整数&quot;,&quot;返回目标类型；非法转换记录诊断&quot;],&quot;explain&quot;:&quot;这是显式转换的规则，不等同于隐式 coercible。即使为了错误恢复返回目标类型，只要 diagnostics 有错误也不能进入后端。&quot;,&quot;source&quot;:&quot;semantic.cpp:1343–1356&quot;},{&quot;id&quot;:&quot;call&quot;,&quot;title&quot;:&quot;call · 函数与关联调用&quot;,&quot;edge&quot;:&quot;check_expr → check_call&quot;,&quot;lines&quot;:[&quot;先检查 callee，确定签名与 target&quot;,&quot;参数个数与形参期望类型逐项核对&quot;,&quot;普通函数 / 关联函数 / 内建调用&quot;],&quot;explain&quot;:&quot;check_signature 检查实参。内建包括 I/O、Box::new、Vec::new 和支持的关联操作；构造容器需要具体类型实参。限定名调用方法时 self 是显式实参。成功返回结果类型和调用目标。&quot;,&quot;source&quot;:&quot;semantic.cpp:1358–1470&quot;},{&quot;id&quot;:&quot;method&quot;,&quot;title&quot;:&quot;method · 接收者 + 实参&quot;,&quot;edge&quot;:&quot;check_expr → check_method&quot;,&quot;lines&quot;:[&quot;接收者沿 Ref / Box 自动解引用&quot;,&quot;查内建 / struct 方法；核对 self 权限&quot;,&quot;检查实参，并记录接收者借用动作&quot;],&quot;explain&quot;:&quot;check_method_signature 检查显式参数。len/is_empty、Vec 修改操作和 clone 有各自候选和能力规则。点调用的用户方法必须有 self；可变 self 要通过 writable。调整挂在方法调用事实上，描述如何传递接收者。&quot;,&quot;source&quot;:&quot;semantic.cpp:1472–1582&quot;},{&quot;id&quot;:&quot;field&quot;,&quot;title&quot;:&quot;field · 字段投影&quot;,&quot;edge&quot;:&quot;check_expr → check_field&quot;,&quot;lines&quot;:[&quot;基对象穿透 Ref / Box&quot;,&quot;核验 struct 与字段，找到字段 ID&quot;,&quot;返回字段 place，传播可写性与锁&quot;],&quot;explain&quot;:&quot;中间遇到共享引用会锁定访问，不能靠更深层的可变引用恢复写权限。自动解引用动作附加到基表达式事实。访问字段并不普遍要求源表达式本身先是 place。&quot;,&quot;source&quot;:&quot;semantic.cpp:1584–1619&quot;},{&quot;id&quot;:&quot;index&quot;,&quot;title&quot;:&quot;index · 元素投影&quot;,&quot;edge&quot;:&quot;check_expr → check_index&quot;,&quot;lines&quot;:[&quot;index 子表达式要求 usize&quot;,&quot;穿透 Ref / Box 后要求 array / Vec&quot;,&quot;返回元素 place；只读 Vec 访问加锁&quot;],&quot;explain&quot;:&quot;索引产生的 ExprInfo 除元素类型外还携带 place、可变性及访问锁。锁用于限制从只读容器访问中获得的后续写权限，不等同于完整借用冲突分析。&quot;,&quot;source&quot;:&quot;semantic.cpp:1621–1653&quot;},{&quot;id&quot;:&quot;break&quot;,&quot;title&quot;:&quot;break · 把类型送回循环&quot;,&quot;edge&quot;:&quot;check_expr → check_break&quot;,&quot;lines&quot;:[&quot;必须存在最近循环&quot;,&quot;可选 value 接收循环 expected&quot;,&quot;把 value 类型加入 break_types；返回 !&quot;],&quot;explain&quot;:&quot;无 value 时使用 Unit。有 value 时递归 check_expr。当前循环之后统一核对收集到的 break 类型；break 自己不向后续正常路径提供值，因此类型为 Never。&quot;,&quot;source&quot;:&quot;semantic.cpp:1655–1666&quot;},{&quot;id&quot;:&quot;continue&quot;,&quot;title&quot;:&quot;continue · 下一次迭代&quot;,&quot;edge&quot;:&quot;check_expr → check_continue&quot;,&quot;lines&quot;:[&quot;必须位于可用循环语境&quot;,&quot;不携带普通结果值&quot;,&quot;返回 Never（!）&quot;],&quot;explain&quot;:&quot;continue 检查 loops_ 是否为空；它改变控制流而不产生普通值。这里记录静态事实，不生成实际循环跳转指令。&quot;,&quot;source&quot;:&quot;semantic.cpp:1668–1672&quot;},{&quot;id&quot;:&quot;return&quot;,&quot;title&quot;:&quot;return · 交回函数结果&quot;,&quot;edge&quot;:&quot;check_expr → check_return&quot;,&quot;lines&quot;:[&quot;value 接收函数声明的返回类型&quot;,&quot;无 value 当作 Unit；检查兼容性&quot;,&quot;整个 return 表达式为 Never（!）&quot;],&quot;explain&quot;:&quot;返回值与 current_function 的 result 匹配，而不是与最近块或循环匹配。无论带不带返回值，return 节点本身均不回到正常的下一表达式。&quot;,&quot;source&quot;:&quot;semantic.cpp:1674–1684&quot;}]},{&quot;id&quot;:&quot;block-steps&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;parent&quot;:&quot;dispatch&quot;,&quot;title&quot;:&quot;Ⅱ · block 展开：局部名字何时生效&quot;,&quot;edge&quot;:&quot;check_expr → check_block：按顺序处理 stmt&quot;,&quot;lines&quot;:[&quot;进入块先压栈；结束块再弹栈，不让局部名字泄漏&quot;,&quot;以下展开 block 分支，不是额外遍历；Empty 直接跳过&quot;],&quot;explain&quot;:&quot;一个块的父节点可以是函数体、分支、循环或另一个表达式。块内部按语句顺序更新作用域，最后决定块的结果类型。let 的类型注解是 ast::Type，不是普通表达式。&quot;,&quot;source&quot;:&quot;semantic.cpp:1090–1139&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;let-type&quot;,&quot;title&quot;:&quot;let · 注解与初始化器&quot;,&quot;edge&quot;:&quot;check_block → resolve_type / check_expr&quot;,&quot;lines&quot;:[&quot;有注解：解析注解，再约束初值&quot;,&quot;无注解：用初值的实际类型&quot;,&quot;新名字此时尚未加入作用域&quot;],&quot;explain&quot;:&quot;例如 let x = x + 1 的初始化器可以引用旧的 x，而不是正在声明的自己。有注解时检查 coercible；若要求可变引用，还要检查初值是否被共享访问锁定。&quot;,&quot;source&quot;:&quot;semantic.cpp:1096–1118&quot;},{&quot;id&quot;:&quot;let-bind&quot;,&quot;title&quot;:&quot;let · 登记新局部绑定&quot;,&quot;edge&quot;:&quot;check_block → record_symbol&quot;,&quot;lines&quot;:[&quot;初值检查后，记录局部声明身份&quot;,&quot;把名字、类型、mut、ID 放入栈顶&quot;,&quot;后续 lookup 才会看见新的绑定&quot;],&quot;explain&quot;:&quot;同层同名绑定更新当前名字表，但已有使用点保存的是各自解析时的声明 SymbolId，因而仍能区别旧值和新值。&quot;,&quot;source&quot;:&quot;semantic.cpp:1119–1128&quot;},{&quot;id&quot;:&quot;stmt-expr&quot;,&quot;title&quot;:&quot;expr stmt · 丢弃值还是返回值&quot;,&quot;edge&quot;:&quot;check_block → check_expr&quot;,&quot;lines&quot;:[&quot;末尾无分号：继承块 expected&quot;,&quot;非尾部无分号：必须 Unit / Never&quot;,&quot;尾值或末尾 Never 决定块结果&quot;],&quot;explain&quot;:&quot;普通带分号语句不会把一个正常值当成块结果。块初始结果为 Unit；最后一个表达式若无分号或为 Never 才更新结果。这里不是通用的不可达代码剔除。&quot;,&quot;source&quot;:&quot;semantic.cpp:1130–1139&quot;}]},{&quot;id&quot;:&quot;rules&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;parent&quot;:&quot;dispatch&quot;,&quot;title&quot;:&quot;Ⅱ · 共享判定：类型、位置、权限、控制流&quot;,&quot;edge&quot;:&quot;各 check_* 分支 → 共享助手（在递归内调用）&quot;,&quot;lines&quot;:[&quot;这是递归检查中的共享规则，不是之后再遍历一次 AST&quot;,&quot;类型相同、可兼容、可写、控制流结果，是不同问题&quot;],&quot;explain&quot;:&quot;专门检查函数在各自语境中调用这些助手。check_expr 会在兼容时补调整并记录事实，但并非只要 expected 不同就统一报错；不兼容诊断主要由 let、调用、返回等具体检查点执行。&quot;,&quot;source&quot;:&quot;semantic.cpp:729–908；各 check_*&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;match&quot;,&quot;title&quot;:&quot;类型 · 相同还是可适配&quot;,&quot;edge&quot;:&quot;same / coercible / common_type&quot;,&quot;lines&quot;:[&quot;same：结构比较，不比较指针地址&quot;,&quot;coercible：从实际类型到期望类型&quot;,&quot;common_type：先试后→前，再试前→后&quot;],&quot;explain&quot;:&quot;same 比较种类、命名类型名字、数组长度和 element、引用可变性等。coercible 允许同型、Never 和受限引用转换；Error 被宽容处理以减少级联错误。common_type 用于数组；if 自己按相似顺序分支判断。&quot;,&quot;source&quot;:&quot;semantic.cpp:37–55,729–756&quot;},{&quot;id&quot;:&quot;permission&quot;,&quot;title&quot;:&quot;位置 / 权限 · 能不能写&quot;,&quot;edge&quot;:&quot;is_place / is_mutable / writable&quot;,&quot;lines&quot;:[&quot;place：表达式代表可定位位置&quot;,&quot;mutable：该位置是否可写&quot;,&quot;locked：共享访问限制不能被绕开&quot;],&quot;explain&quot;:&quot;赋值必须是可写 place。方法接收者还会用 writable：先拒绝锁定，穿透 Box，再按引用 mut 或位置属性决定。当前实现并不一概拒绝临时对象上的借用、字段投影或方法调用。&quot;,&quot;source&quot;:&quot;semantic.cpp:758–767,1211–1252,1314–1341&quot;},{&quot;id&quot;:&quot;converge&quot;,&quot;title&quot;:&quot;控制流 · 正常结果如何汇合&quot;,&quot;edge&quot;:&quot;check_if / check_loop / check_while&quot;,&quot;lines&quot;:[&quot;if：选择可适配的分支结果&quot;,&quot;loop：统一所有 break value&quot;,&quot;Never 可适配任意目标，不提供普通值&quot;],&quot;explain&quot;:&quot;类型检查只做当前实现的局部收敛：不是完整控制流可达性分析，也不是通用约束网络。Never 代表不能正常返回值，Error 代表分析失败占位，二者不能混淆。&quot;,&quot;source&quot;:&quot;semantic.cpp:1141–1209,1655–1684&quot;},{&quot;id&quot;:&quot;type-tools&quot;,&quot;title&quot;:&quot;类型构造 · 辅助判断&quot;,&quot;edge&quot;:&quot;ty / compound / integer / signed_integer&quot;,&quot;lines&quot;:[&quot;ty：新建对象，没有类型驻留池&quot;,&quot;compound：挂上 element 与 mut&quot;,&quot;整数分类供字面量、运算与 as 使用&quot;],&quot;explain&quot;:&quot;没有类型驻留池或统一指针身份：ty 用 make_shared 创建对象，两个 i32 指针可不同但 same 返回 true。TyPtr 是递归结构的共享指针，不等于 interning。&quot;,&quot;source&quot;:&quot;semantic.cpp:24–66&quot;},{&quot;id&quot;:&quot;path-lookup&quot;,&quot;title&quot;:&quot;路径查找 · 词法与限定名&quot;,&quot;edge&quot;:&quot;check_path → join_path / lookup&quot;,&quot;lines&quot;:[&quot;join_path：组成 :: 限定路径&quot;,&quot;lookup：作用域栈由内向外找&quot;,&quot;Self 按当前函数的 owner 解释&quot;],&quot;explain&quot;:&quot;路径只返回解析结果，不执行函数调用。找到局部声明时把 Binding 转成具有 symbol、type 和 mut 信息的 place；找不到再尝试其他适用的全局或关联实体。&quot;,&quot;source&quot;:&quot;semantic.cpp:722–727,910–966,1686–1694&quot;},{&quot;id&quot;:&quot;builtins&quot;,&quot;title&quot;:&quot;内建候选 · 还不是合法调用&quot;,&quot;edge&quot;:&quot;check_path → builtin_function / constructor_path&quot;,&quot;lines&quot;:[&quot;识别 I/O 和容器关联路径&quot;,&quot;struct::clone 也是候选之一&quot;,&quot;参数、类型实参与能力稍后检查&quot;],&quot;explain&quot;:&quot;constructor_path 只是让特定路径进入 check_call 的内建分派，不保证每个候选操作适用于所有容器。最终目标和结果要由具体调用分支确认。&quot;,&quot;source&quot;:&quot;semantic.cpp:959–980&quot;},{&quot;id&quot;:&quot;call-args&quot;,&quot;title&quot;:&quot;call · 形参与实参配对&quot;,&quot;edge&quot;:&quot;check_call → check_signature&quot;,&quot;lines&quot;:[&quot;先检查实参数量&quot;,&quot;形参类型作为实参 expected&quot;,&quot;再检查兼容及可变引用访问限制&quot;],&quot;explain&quot;:&quot;数量不符仍检查已提供的参数以收集错误。普通签名检查还拒绝把 access_locked 的结果当可变引用传递。函数调用返回签名给出的结果类型。&quot;,&quot;source&quot;:&quot;semantic.cpp:1454–1470&quot;},{&quot;id&quot;:&quot;method-args&quot;,&quot;title&quot;:&quot;method · 显式实参配对&quot;,&quot;edge&quot;:&quot;check_method → check_method_signature&quot;,&quot;lines&quot;:[&quot;self 在接收者路径中单独处理&quot;,&quot;这里匹配剩余实参数量与类型&quot;,&quot;调用结果采用方法声明的返回类型&quot;],&quot;explain&quot;:&quot;接收者的自动解引用、共享或可变借用与权限核验由 check_method 完成；此助手检查点号调用中括号里的显式实参。&quot;,&quot;source&quot;:&quot;semantic.cpp:1569–1582&quot;},{&quot;id&quot;:&quot;scalar&quot;,&quot;title&quot;:&quot;标量视图 · 运算规则辅助&quot;,&quot;edge&quot;:&quot;check_binary / check_assignment → scalar_operand&quot;,&quot;lines&quot;:[&quot;适用位置剥掉一层共享引用&quot;,&quot;随后按 bool / 整数规则核验&quot;,&quot;不是通用递归自动解引用&quot;],&quot;explain&quot;:&quot;scalar_operand 不剥可变引用，也不无限穿透引用链。逻辑、比较、按位、移位和赋值运算的可接受组合由各自检查分支明确决定。&quot;,&quot;source&quot;:&quot;semantic.cpp:1254–1341&quot;}]},{&quot;id&quot;:&quot;facts&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;parent&quot;:&quot;dispatch&quot;,&quot;title&quot;:&quot;Ⅱ · 每次递归返回：保留源类型，另记适配动作&quot;,&quot;edge&quot;:&quot;check_expr：coercible → coercion_adjustments → record_expression&quot;,&quot;lines&quot;:[&quot;每个子表达式检查完，返回 ExprInfo 给父节点继续判断&quot;,&quot;同时写 NodeId 旁表；分支 / 投影 / 方法可补充调整&quot;],&quot;explain&quot;:&quot;这一步发生在每次 check_expr 调用的末尾，不是只在整个函数检查完后执行一次。expected 存在且可兼容时计算调整；然后 record_expression 保存节点事实，原实际类型不被替换成 expected。&quot;,&quot;source&quot;:&quot;semantic.cpp:800–908&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;adjust&quot;,&quot;title&quot;:&quot;adjustments · 隐式适配序列&quot;,&quot;edge&quot;:&quot;coercion_adjustments / append_adjustments&quot;,&quot;lines&quot;:[&quot;解引用 · 共享借用 · 可变借用&quot;,&quot;可变引用降为共享 · Never 适配&quot;,&quot;严格保留动作顺序，交后续 lowering&quot;],&quot;explain&quot;:&quot;对应 Dereference、BorrowShared、BorrowMutable、MutToShared、NeverToAny。不是任意 T 都能隐式变成 &amp;T：一般兼容性检查主要处理引用到引用；方法接收者自动借用另有入口。append_adjustments 可回填已检查分支。&quot;,&quot;source&quot;:&quot;semantic.cpp:800–840,1141–1172,1472–1567&quot;},{&quot;id&quot;:&quot;exprinfo&quot;,&quot;title&quot;:&quot;expr · 实际类型与访问事实&quot;,&quot;edge&quot;:&quot;record_expression → expression_facts_&quot;,&quot;lines&quot;:[&quot;NodeId → type、place、mutable、locked&quot;,&quot;附带 symbol、调用 target、adjustments&quot;,&quot;方法的 adjustments 描述接收者传参&quot;],&quot;explain&quot;:&quot;ExprInfo 是递归调用间的临时结果；ExpressionSemantics 是可导出的旁表条目。表达式的源类型与使用位置需要的调整同时存在，后端无须重新猜测。&quot;,&quot;source&quot;:&quot;semantic.cpp:140–156,842–848；semantic.hpp&quot;},{&quot;id&quot;:&quot;errors&quot;,&quot;title&quot;:&quot;诊断 · 标出问题但继续收集&quot;,&quot;edge&quot;:&quot;mismatch → type_name → report&quot;,&quot;lines&quot;:[&quot;report 用 Span 定位错误&quot;,&quot;Error 类型减少后续级联报错&quot;,&quot;报告错误不等于立刻中断 run&quot;],&quot;explain&quot;:&quot;多数专门规则可直接 report，类型不符通常用 mismatch 生成 found/expected 文本。Error 可参与宽容比较是恢复机制，不是合法可执行类型；最终错误闸门会阻止 lowering。&quot;,&quot;source&quot;:&quot;semantic.cpp:68–104,201–203,769–772&quot;}]},{&quot;id&quot;:&quot;output&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;title&quot;:&quot;出口｜原 AST + 语义旁表；诊断决定能否继续&quot;,&quot;edge&quot;:&quot;check_functions 返回 → run 汇总 → main 检查诊断&quot;,&quot;lines&quot;:[&quot;整理并稳定导出事实；不改写 AST，也不新建 HIR&quot;,&quot;无错误 → lower(AST, SemanticResult)；有错误 → 停止&quot;],&quot;explain&quot;:&quot;run 汇总顶层声明计数，按 ID 排序符号和常量，把按 NodeId 保存的表达式与类型事实导出。常量成功值转换为 32 位位模式。main.cpp 的错误检查在 lowering 之前，失败时不能把恢复性 Error 事实交给后端。&quot;,&quot;source&quot;:&quot;semantic.cpp:169–198；main.cpp:133–144&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;out-symbol&quot;,&quot;title&quot;:&quot;symbols · 谁是谁&quot;,&quot;edge&quot;:&quot;record_symbol → run 汇总&quot;,&quot;lines&quot;:[&quot;声明身份、种类、名字、owner&quot;,&quot;包括字段、参数和局部绑定&quot;,&quot;使用点的 symbol 指回具体声明&quot;],&quot;explain&quot;:&quot;相同名字在不同作用域中可以有不同 ID。summary 只计顶层 structures/functions/constants，不代表 symbols 向量里所有实体的总数。&quot;,&quot;source&quot;:&quot;semantic.cpp:176–198；semantic.hpp:58–64&quot;},{&quot;id&quot;:&quot;out-type&quot;,&quot;title&quot;:&quot;resolved types · 注解含义&quot;,&quot;edge&quot;:&quot;resolve_type → run 汇总&quot;,&quot;lines&quot;:[&quot;ast::Type NodeId → 语义类型&quot;,&quot;包括声明、局部注解、cast 目标&quot;,&quot;lowering 复用，不再自行解析类型&quot;],&quot;explain&quot;:&quot;TypeResolution 与表达式类型表用途不同：前者回答一个类型语法节点表示什么，后者回答一个表达式求值有什么类型与权限。&quot;,&quot;source&quot;:&quot;semantic.cpp:263–269；semantic.hpp:87–91&quot;},{&quot;id&quot;:&quot;out-const&quot;,&quot;title&quot;:&quot;constants · 编译期数值&quot;,&quot;edge&quot;:&quot;evaluate_constant → run 汇总&quot;,&quot;lines&quot;:[&quot;仅导出 Done 状态的常量&quot;,&quot;常量 SymbolId → 32 位 bits&quot;,&quot;全局与关联常量统一导出&quot;],&quot;explain&quot;:&quot;内部求值暂存 int64_t；导出的 ConstantValue 用 uint32_t 位模式。不要把内部暂存宽度误认为语言目标机器整数宽度。&quot;,&quot;source&quot;:&quot;semantic.cpp:186–196；semantic.hpp:93–96&quot;},{&quot;id&quot;:&quot;out-next&quot;,&quot;title&quot;:&quot;expressions · 后续转换依据&quot;,&quot;edge&quot;:&quot;SemanticResult → lower / dump_semantic&quot;,&quot;lines&quot;:[&quot;lower：连同原 AST 消费已检查事实&quot;,&quot;dump：输出符号、表达式和调整文本&quot;,&quot;运行时执行次序由 lowering 明确生成&quot;],&quot;explain&quot;:&quot;SemanticResult 还包含 summary、symbols、resolved_types、constants。dump_semantic 是调试输出，不把所有公开表都完整打印，也不会替代语义检查或代码生成。&quot;,&quot;source&quot;:&quot;semantic.cpp:1723–1781；src/main.cpp:133–144&quot;},{&quot;id&quot;:&quot;boundary&quot;,&quot;title&quot;:&quot;当前边界 · 不是完整 Rust&quot;,&quot;edge&quot;:&quot;semantic 的职责边界&quot;,&quot;lines&quot;:[&quot;局部推断，不是通用约束求解器&quot;,&quot;有限 derive，不是开放式 Trait 系统&quot;,&quot;检查访问权限，不是完整借用检查器&quot;],&quot;explain&quot;:&quot;不做完整所有权移动、生命周期和借用冲突证明；不能把 access_locked 等局部安全规则当作完整 borrow checker。本图描述项目现有实现，而不是语言理论上可以实现的全部语义分析功能。&quot;,&quot;source&quot;:&quot;doc/reading/semantic.md:3542–3544&quot;}]},{&quot;id&quot;:&quot;example&quot;,&quot;stage&quot;:&quot;b&quot;,&quot;title&quot;:&quot;贯通例子｜为什么“原类型”与“适配动作”要分开&quot;,&quot;edge&quot;:&quot;同一机制的实例，不是新增分析阶段&quot;,&quot;lines&quot;:[&quot;fn read(p: &amp;i32) -&gt; i32 { *p }&quot;,&quot;函数体内：let b = Box::\u003ci32&gt;::new(7); read(&amp;b);&quot;],&quot;explain&quot;:&quot;例子来自项目阅读文档。它把声明准备、局部作用域、实参检查和旁表输出串起来：read 需要 &amp;i32，而 &amp;b 原本是 &amp;Box\u003ci32&gt;；语义层保存两者的关系，lowering 再生成真实的指针操作。&quot;,&quot;source&quot;:&quot;doc/reading/semantic.md:3534–3540&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;ex1&quot;,&quot;title&quot;:&quot;① 先登记 read 的规则&quot;,&quot;edge&quot;:&quot;collect_items → resolve_function&quot;,&quot;lines&quot;:[&quot;名字 read 连接函数声明 ID&quot;,&quot;签名：参数 &amp;i32，结果 i32&quot;,&quot;尚未检查调用 read(&amp;b)&quot;],&quot;explain&quot;:&quot;这一步可以先于 read 的函数体或调用它的函数体。调用位置只要查表就能知道参数期望类型。&quot;,&quot;source&quot;:&quot;semantic.cpp:211,485&quot;},{&quot;id&quot;:&quot;ex2&quot;,&quot;title&quot;:&quot;② 再建立局部 b&quot;,&quot;edge&quot;:&quot;check_block → check_call&quot;,&quot;lines&quot;:[&quot;Box::\u003ci32&gt;::new(7) 的结果为 Box\u003ci32&gt;&quot;,&quot;检查初值后，把 b 加入当前作用域&quot;,&quot;绑定记录类型、mut 与声明 ID&quot;],&quot;explain&quot;:&quot;不是 collect_items 收集局部变量。b 只有在正文按顺序执行到这个 let 的静态检查位置后，才对后续名字查找可见。&quot;,&quot;source&quot;:&quot;semantic.cpp:1090,1358&quot;},{&quot;id&quot;:&quot;ex3&quot;,&quot;title&quot;:&quot;③ 把形参期望向下传&quot;,&quot;edge&quot;:&quot;check_call → check_signature → check_expr&quot;,&quot;lines&quot;:[&quot;形参给实参的 expected 是 &amp;i32&quot;,&quot;check_unary 得到 &amp;b 的实际类型&quot;,&quot;实际类型仍然是 &amp;Box\u003ci32&gt;&quot;],&quot;explain&quot;:&quot;借用表达式内部按自身规则检查 b。外部 expected 不把 Box\u003ci32&gt; 偷换成 i32，而是在表达式检查返回后触发兼容性与调整计算。&quot;,&quot;source&quot;:&quot;semantic.cpp:1211,1454,850&quot;},{&quot;id&quot;:&quot;ex4&quot;,&quot;title&quot;:&quot;④ 记录怎样用于此次调用&quot;,&quot;edge&quot;:&quot;coercion_adjustments → record_expression&quot;,&quot;lines&quot;:[&quot;&amp;Box\u003ci32&gt; → Box\u003ci32&gt; → i32&quot;,&quot;两次解引用，再共享借用为 &amp;i32&quot;,&quot;旁表保留原类型及这条动作序列&quot;],&quot;explain&quot;:&quot;coercible 判断引用链可适配。coercion_adjustments 依次记录 Dereference 到 Box\u003ci32&gt;、Dereference 到 i32、BorrowShared 到 &amp;i32。read 调用节点结果类型为 i32；lowering 消费这些事实。&quot;,&quot;source&quot;:&quot;semantic.cpp:729–748,800–831&quot;}]}];
  const all=groups.flatMap(g=&gt;[g,...g.children]),data=new Map(all.map(n=&gt;[n.id,n]));

  function wrap(value,max,size=21){ctx.font=`${size}px &quot;Microsoft YaHei&quot;,sans-serif`;const lines=[];let line=&#x27;&#x27;;for(const token of String(value).match(/[A-Za-z_][A-Za-z0-9_:]*|./gu)||[]){const parts=ctx.measureText(token).width&gt;max?[...token]:[token];for(const p of parts){if(line&amp;&amp;ctx.measureText(line+p).width&gt;max){lines.push(line.trim());line=p}else line+=p}}if(line)lines.push(line.trim());return lines}
