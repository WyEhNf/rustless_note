<script>
const stage=document.getElementById('stage'),sheet=document.getElementById('sheet'),extent=document.getElementById('extent');let scale=1;
function zoom(value,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const old=scale,px=(stage.scrollLeft+cx)/old,py=(stage.scrollTop+cy)/old;scale=Math.max(.15,Math.min(2,value));sheet.style.transform='scale('+scale+')';extent.style.width=(3000*scale)+'px';extent.style.height=(4420*scale)+'px';sheet.style.width='3000px';sheet.style.height='4420px';document.getElementById('status').textContent=Math.round(scale*100)+'%';stage.scrollLeft=px*scale-cx;stage.scrollTop=py*scale-cy;}
document.getElementById('plus').onclick=()=>zoom(scale*1.2);document.getElementById('minus').onclick=()=>zoom(scale/1.2);document.getElementById('fit').onclick=()=>{zoom(stage.clientWidth/3000);stage.scrollTop=0;stage.scrollLeft=0;};document.getElementById('read').onclick=()=>zoom(.85);
stage.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=stage.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.003),e.clientX-r.left,e.clientY-r.top);}},{passive:false});
document.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const n=document.getElementById(a.dataset.jump),b=n.getBBox();zoom(Math.max(scale,.75));stage.scrollTo({left:Math.max(0,(b.x-60)*scale),top:Math.max(0,(b.y-70)*scale),behavior:'smooth'});}));
const blob=new Blob([new XMLSerializer().serializeToString(sheet.querySelector('svg'))],{type:'image/svg+xml'});document.getElementById('download').href=URL.createObjectURL(blob);
zoom(stage.clientWidth/3000,0,0);
</script></body></html>
